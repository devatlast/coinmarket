<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyWallet - Login</title>

    <link rel="stylesheet" href="./src/style.css">

</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                CoinMarket

            </div>

            <h1>Welcome back</h1>

            <p class="auth-subtitle">

                Login to access your wallet

            </p>

            <form id="loginForm">

                <label for="email">

                    Email

                </label>

                <input

                    type="email"

                    id="email"

                    placeholder="you@example.com"

                    required

                >

                <label for="password">

                    Password

                </label>

                <input

                    type="password"

                    id="password"

                    placeholder="Enter your password"

                    required

                >

                <button

                    type="submit"

                    class="primary-btn"

                >

                    Login

                </button>

            </form>

            <p id="message" class="auth-message"></p>

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">

                    Create one

                </a>

            </p>

        </div>

    </main>

    <script type="module" src="./src/main.js"></script>

</body>

</html>
